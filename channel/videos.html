<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Aslambik - Video - MAB-Video</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="css/channel.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <button class="icon-button menu-button" id="menuButton" aria-label="Buka menu">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
            </button>
            <a href="../index.html" class="logo"><span class="logo-icon">▶</span><span class="logo-text">MAB-Video</span></a>
        </div>
        <div class="search-wrapper">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search">
                <button class="search-button" id="searchButton" aria-label="Search">🔍</button>
            </div>
            <button class="voice-search-button" id="voiceSearchButton" aria-label="Telusuri dengan suara" type="button">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 15a3 3 0 003-3V6a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-2.08A7 7 0 0019 12h-2z"/></svg>
            </button>
        </div>
        <div class="header-right">
            <button class="icon-button" id="themeButton" aria-label="Toggle dark mode">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 019.5 4 8.5 8.5 0 1020 14.5z"/></svg>
            </button>
            <div class="create-wrapper">
                <button class="create-button" id="createButton" type="button"><span class="create-icon">+</span> Buat</button>
                <div class="create-menu" id="createMenu"></div>
            </div>
            <div class="notification-wrapper">
                <button class="icon-button" id="notificationButton" aria-label="Notifikasi">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 22a2.2 2.2 0 002.2-2.2h-4.4A2.2 2.2 0 0012 22zm7-6v-5a7 7 0 00-5.5-6.84V3a1.5 1.5 0 00-3 0v1.16A7 7 0 005 11v5l-2 2v1h18v-1z"/></svg>
                </button>
                <div class="notification-menu" id="notificationMenu"><p class="notification-title">Notifikasi</p><p class="notification-empty">Tidak ada notifikasi baru.</p></div>
            </div>
            <div class="profile-wrapper">
                <button class="profile-button" id="profileButton" aria-label="Akun">M</button>
                <div class="profile-menu" id="profileMenu"></div>
            </div>
        </div>
    </header>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="channel-banner"></div>
    <div class="channel-header">
        <div class="channel-header-avatar">M</div>
        <div class="channel-header-info">
            <h1 class="channel-header-name">Muhammad Aslambik</h1>
            <p class="channel-header-meta">@muhammadaslambik &middot; 13 subscriber &middot; 12 video</p>
            <p class="channel-header-desc">Selamat datang di channel MAB-Video! Berbagi video seputar sejarah, teknologi, dan berbagai topik menarik lainnya.</p>
        </div>
        <div class="channel-subscribe-area"><button class="subscribe-button" id="channelSubscribeButton" type="button">Subscribe</button></div>
    </div>
    <div class="channel-tabs">
        <a href="index.html" class="channel-tab">Beranda</a>
        <a href="videos.html" class="channel-tab active">Video</a>
        <a href="shorts.html" class="channel-tab">Shorts</a>
        <a href="playlists.html" class="channel-tab">Playlist</a>
        <a href="community.html" class="channel-tab">Komunitas</a>
        <a href="about.html" class="channel-tab">Tentang</a>
    </div>
    <div class="channel-content">
        <div class="video-grid" id="videoGrid"></div>
    </div>

    <script>window.MAB_ROOT = "../";</script>
    <script src="../js/main.js"></script>
    <script src="js/channel.js"></script>
</body>
</html>
