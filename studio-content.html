<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Konten - MAB-Video Studio</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body class="studio-body">

    <!-- ================= STUDIO HEADER ================= -->

    <header class="studio-header">

        <div class="studio-header-left">

            <button
                class="icon-button menu-button"
                id="menuButton"
                aria-label="Buka menu"
            >
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
            </button>

            <a href="index.html" class="studio-logo">
                <span class="logo-icon">▶</span>
                <span class="studio-logo-text">Studio</span>
            </a>

        </div>

        <div class="studio-header-search">

            <div class="search-container">

                <input
                    type="text"
                    id="studioSearchInput"
                    placeholder="Telusuri konten di channel Anda"
                >

                <button
                    class="search-button"
                    id="studioSearchButton"
                    aria-label="Telusuri"
                >
                    🔍
                </button>

            </div>

        </div>

        <div class="studio-header-right">

            <button
                class="icon-button"
                id="studioHelpButton"
                aria-label="Bantuan"
            >
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 .5c0 1.5-2 1.7-2.3 3M12 17h.01"/></svg>
            </button>

            <div class="notification-wrapper">

                <button
                    class="icon-button"
                    id="notificationButton"
                    aria-label="Notifikasi"
                >
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 22a2.2 2.2 0 002.2-2.2h-4.4A2.2 2.2 0 0012 22zm7-6v-5a7 7 0 00-5.5-6.84V3a1.5 1.5 0 00-3 0v1.16A7 7 0 005 11v5l-2 2v1h18v-1z"/></svg>
                </button>

                <div class="notification-menu" id="notificationMenu">
                    <p class="notification-title">Notifikasi</p>
                    <p class="notification-empty">Tidak ada notifikasi baru.</p>
                </div>

            </div>

            <button
                class="studio-request-button"
                id="studioRequestButton"
                type="button"
            >
                Minta Studio
            </button>

            <div class="create-wrapper">

                <button
                    class="studio-create-button"
                    id="createButton"
                    type="button"
                >
                    <span class="create-icon">+</span>
                    Buat
                </button>

                <div class="create-menu" id="createMenu"></div>

            </div>

            <button
                class="profile-button"
                id="profileButton"
                aria-label="Akun"
            >
                M
            </button>

            <div class="profile-menu" id="profileMenu"></div>

        </div>

    </header>


    <!-- ================= STUDIO SIDEBAR ================= -->

    <aside class="studio-sidebar" id="studioSidebar">

        <div class="studio-channel-block">

            <div class="studio-channel-avatar">M</div>

            <p class="studio-channel-label">Channel Anda</p>
            <p class="studio-channel-name">Muhammad Aslambik</p>

        </div>

        <nav>

            <a href="studio.html" class="studio-sidebar-item">
                <span class="studio-sidebar-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg></span>
                <span>Dasbor</span>
            </a>

            <a href="studio-content.html" class="studio-sidebar-item active">
                <span class="studio-sidebar-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M4 5a2 2 0 012-2h12a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm6 3v8l6-4z"/></svg></span>
                <span>Konten</span>
            </a>

            <a href="#" class="studio-sidebar-item" data-toast="1">
                <span class="studio-sidebar-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M11 19V4M18 19v-6"/></svg></span>
                <span>Analytics</span>
            </a>

            <a href="#" class="studio-sidebar-item" data-toast="1">
                <span class="studio-sidebar-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M4 4h16v11H8l-4 4z"/></svg></span>
                <span>Komunitas</span>
            </a>

            <a href="#" class="studio-sidebar-item" data-toast="1">
                <span class="studio-sidebar-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h11M9 3v2c0 4-3 8-7 9M6 9c1 2 4 4 7 4M13 21l5-11 5 11M15 17h6"/></svg></span>
                <span>Bahasa dan teks</span>
            </a>

            <a href="#" class="studio-sidebar-item" data-toast="1">
                <span class="studio-sidebar-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg></span>
                <span>Deteksi konten</span>
            </a>

            <a href="#" class="studio-sidebar-item" data-toast="1">
                <span class="studio-sidebar-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2M8 3.5l1.5 2M16 3.5L14.5 5.5"/></svg></span>
                <span>Penghasilan</span>
            </a>

            <a href="#" class="studio-sidebar-item" data-toast="1">
                <span class="studio-sidebar-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-11 4 11M6 15h4M13 4l3 8 3-8M14.5 9h3"/></svg></span>
                <span>Penyesuaian</span>
            </a>

            <a href="#" class="studio-sidebar-item" data-toast="1">
                <span class="studio-sidebar-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M9 18V5l11-2v13M9 18a3 3 0 11-6 0 3 3 0 016 0zm11-2a3 3 0 11-6 0 3 3 0 016 0z"/></svg></span>
                <span>Koleksi audio</span>
            </a>

            <div class="studio-sidebar-divider"></div>

            <a href="#" class="studio-sidebar-item" data-toast="1">
                <span class="studio-sidebar-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.9 2.9l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.6V21a2 2 0 11-4 0v-.2a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.9-2.9l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.6-1H3a2 2 0 110-4h.2a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.9-2.9l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.6V3a2 2 0 114 0v.2a1.7 1.7 0 001 1.6 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.9 2.9l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.6 1H21a2 2 0 110 4h-.2a1.7 1.7 0 00-1.6 1z"/></svg></span>
                <span>Setelan</span>
            </a>

            <a href="#" class="studio-sidebar-item" data-toast="1">
                <span class="studio-sidebar-icon"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H8l-4 4z"/><path d="M8 9h8M8 12h5"/></svg></span>
                <span>Kirim masukan</span>
            </a>

        </nav>

    </aside>


    <!-- MOBILE SIDEBAR OVERLAY -->

    <div class="sidebar-overlay" id="sidebarOverlay"></div>


    <!-- ================= STUDIO MAIN ================= -->

    <main class="studio-main">

        <div class="studio-content-header">

            <h1 class="studio-page-title">Konten</h1>

            <button class="studio-secondary-button studio-customize-button" data-toast="1" type="button">
                ✎ Sesuaikan
            </button>

        </div>

        <div class="studio-content-tabs">

            <button class="studio-content-tab active" data-tab="video" type="button">
                Video
            </button>

            <button class="studio-content-tab" data-tab="playlist" type="button">
                Playlist ▾
            </button>

        </div>


        <!-- ================= VIDEO ================= -->

        <section class="studio-content-section" id="studioVideoSection">

            <div class="studio-section-header">
                <h2>Video</h2>
                <button class="studio-link-button" data-toast="1" type="button">Lihat semua</button>
            </div>

            <div class="studio-content-row" id="studioVideoRow"></div>

        </section>


        <!-- ================= PLAYLIST ================= -->

        <section class="studio-content-section" id="studioPlaylistSection">

            <div class="studio-section-header">
                <h2>Playlist</h2>
                <button class="studio-link-button" data-toast="1" type="button">Lihat semua</button>
            </div>

            <p class="studio-empty-text">
                Anda belum memiliki daftar putar.
            </p>

        </section>

    </main>


    <script src="js/script.js"></script>
    <script src="js/studio.js"></script>
    <script src="js/studio-content.js"></script>

</body>

</html>
