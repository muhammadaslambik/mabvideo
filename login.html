<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MAB-Video</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-page">
        <a href="index.html" class="auth-logo"><span class="logo-icon">▶</span><span class="logo-text">MAB-Video</span></a>
        <div class="auth-card">
            <h1 class="auth-title">Masuk</h1>
            <p class="auth-subtitle">Gunakan Akun MAB-Video Anda</p>
            <form id="loginForm" class="auth-form">
                <label class="auth-field"><span>Email atau nomor HP</span><input type="text" id="loginEmail" required></label>
                <label class="auth-field"><span>Kata sandi</span><input type="password" id="loginPassword" required></label>
                <a href="#" class="auth-link">Lupa kata sandi?</a>
                <div class="auth-actions">
                    <a href="register.html" class="auth-secondary-link">Buat akun</a>
                    <button type="submit" class="auth-primary-button">Berikutnya</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
