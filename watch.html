<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Watch - MAB-Video</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body class="watch-page">

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="header-left">

            <button
                class="icon-button menu-button"
                id="menuButton"
                aria-label="Open menu"
            >
                ☰
            </button>

            <a
                href="index.html"
                class="logo"
            >

                <span class="logo-icon">
                    ▶
                </span>

                <span class="logo-text">
                    MAB-Video
                </span>

            </a>

        </div>


        <!-- SEARCH -->

        <div class="search-wrapper">

            <div class="search-container">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search"
                >

                <button
                    class="search-button"
                    id="searchButton"
                    aria-label="Search"
                >
                    🔍
                </button>

            </div>

            <button
                class="voice-search-button"
                id="voiceSearchButton"
                aria-label="Telusuri dengan suara"
                title="Telusuri dengan suara"
                type="button"
            >
                🎤
            </button>

        </div>


        <!-- HEADER RIGHT -->

        <div class="header-right">

            <button
                class="icon-button"
                id="themeButton"
                aria-label="Toggle dark mode"
            >
                🌙
            </button>

            <div class="create-wrapper">

                <button
                    class="create-button"
                    id="createButton"
                    aria-label="Buat atau unggah video"
                    type="button"
                >
                    <span class="create-icon">+</span>
                    Buat
                </button>

                <div
                    class="create-menu"
                    id="createMenu"
                ></div>

            </div>

            <div class="notification-wrapper">

                <button
                    class="icon-button"
                    id="notificationButton"
                    aria-label="Notifikasi"
                >
                    🔔
                </button>

                <div
                    class="notification-menu"
                    id="notificationMenu"
                >

                    <p class="notification-title">
                        Notifikasi
                    </p>

                    <p class="notification-empty">
                        Tidak ada notifikasi baru.
                    </p>

                </div>

            </div>

            <div class="profile-wrapper">

                <button
                    class="profile-button"
                    id="profileButton"
                    aria-label="Akun"
                >
                    M
                </button>

                <div
                    class="profile-menu"
                    id="profileMenu"
                ></div>

            </div>

        </div>

    </header>


    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar" id="sidebar">

        <nav>

            <a href="index.html" class="sidebar-item">
                <span>🏠</span>
                <span>Home</span>
            </a>

            <a href="#" class="sidebar-item">
                <span>🔥</span>
                <span>Trending</span>
            </a>

            <a href="#" class="sidebar-item">
                <span>📺</span>
                <span>Subscriptions</span>
            </a>

            <div class="sidebar-divider"></div>

            <a href="#" class="sidebar-item">
                <span>📚</span>
                <span>Library</span>
            </a>

            <a href="#" class="sidebar-item">
                <span>🕘</span>
                <span>History</span>
            </a>

            <a href="#" class="sidebar-item">
                <span>▶️</span>
                <span>Your videos</span>
            </a>

            <a href="#" class="sidebar-item">
                <span>⏰</span>
                <span>Watch later</span>
            </a>

            <div class="sidebar-divider"></div>

            <h3>Explore</h3>

            <a href="#" class="sidebar-item">
                <span>🎵</span>
                <span>Music</span>
            </a>

            <a href="#" class="sidebar-item">
                <span>🎮</span>
                <span>Gaming</span>
            </a>

            <a href="#" class="sidebar-item">
                <span>💻</span>
                <span>Technology</span>
            </a>

            <a href="#" class="sidebar-item">
                <span>📚</span>
                <span>Education</span>
            </a>

        </nav>

    </aside>


    <!-- MOBILE SIDEBAR OVERLAY -->

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>


    <!-- ================= WATCH PAGE ================= -->

    <main class="watch-main main-content">

        <div class="watch-container">

        <section class="watch-primary">

        <!-- VIDEO PLAYER -->

    <div class="video-player" id="videoPlayer">

        <video
            id="mainVideo"
            preload="metadata"
        >
        </video>

        <button
            class="play-button"
            id="playButton"
            aria-label="Play video"
        >
            ▶
        </button>

    </div>


            <!-- VIDEO TITLE -->

            <h1
                class="watch-title"
                id="videoTitle"
            >
                Loading video...
            </h1>


            <!-- VIDEO INFORMATION -->

            <div
                class="watch-info"
                id="videoInfo"
            >
                Loading information...
            </div>


            <!-- COMMENTS -->

            <div
                class="comments-section"
                id="commentsSection"
            ></div>

        </section>


        <!-- VIDEO TERKAIT -->

        <aside
            class="watch-secondary"
            id="watchSecondary"
        ></aside>

        </div>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
