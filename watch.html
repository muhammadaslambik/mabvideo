<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Watch - MAB-Video</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="header-left">

            <button
                class="icon-button"
                id="backButton"
                aria-label="Go back"
            >
                ←
            </button>

            <a
                href="index.html"
                class="logo"
            >

                <span class="logo-icon">
                    ▶
                </span>

                <span class="logo-text">
                    MAB-Video
                </span>

            </a>

        </div>

    </header>


    <!-- ================= WATCH PAGE ================= -->

    <main class="watch-main">

        <!-- VIDEO PLAYER -->

        <section class="watch-container">

            <div
                class="video-player"
                id="videoPlayer"
            >

                <div class="video-placeholder">
                    ▶
                </div>

            </div>


            <!-- VIDEO TITLE -->

            <h1
                class="watch-title"
                id="videoTitle"
            >
                Loading video...
            </h1>


            <!-- VIDEO INFORMATION -->

            <div
                class="watch-info"
                id="videoInfo"
            >
                Loading information...
            </div>

        </section>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
