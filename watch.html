<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Watch - MAB-Video</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <header class="header">

        <div class="header-left">

            <button
                class="icon-button"
                onclick="history.back()"
            >
                ←
            </button>

            <a
                href="index.html"
                class="logo"
            >

                <span class="logo-icon">
                    ▶
                </span>

                <span class="logo-text">
                    MAB-Video
                </span>

            </a>

        </div>

    </header>


    <main
        class="main-content"
        style="margin-left: 0;"
    >

        <section class="watch-page">

            <div
                id="videoPlayer"
                class="video-player"
            >

                <div class="video-placeholder">
                    ▶
                </div>

            </div>


            <h1 id="videoTitle">
                Loading video...
            </h1>


            <div id="videoInfo">

                Loading information...

            </div>

        </section>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
