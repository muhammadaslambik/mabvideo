<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Watch - MAB-Video</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body class="watch-page">

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="header-left">

            <button
                class="icon-button menu-button"
                id="menuButton"
                aria-label="Open menu"
            >
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
            </button>

            <a
                href="index.html"
                class="logo"
            >

                <span class="logo-icon">
                    ▶
                </span>

                <span class="logo-text">
                    MAB-Video
                </span>

            </a>

        </div>


        <!-- SEARCH -->

        <div class="search-wrapper">

            <div class="search-container">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search"
                >

                <button
                    class="search-button"
                    id="searchButton"
                    aria-label="Search"
                >
                    🔍
                </button>

            </div>

            <button
                class="voice-search-button"
                id="voiceSearchButton"
                aria-label="Telusuri dengan suara"
                title="Telusuri dengan suara"
                type="button"
            >
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 15a3 3 0 003-3V6a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-2.08A7 7 0 0019 12h-2z"/></svg>
            </button>

        </div>


        <!-- HEADER RIGHT -->

        <div class="header-right">

            <button
                class="icon-button"
                id="themeButton"
                aria-label="Toggle dark mode"
            >
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 019.5 4 8.5 8.5 0 1020 14.5z"/></svg>
            </button>

            <div class="create-wrapper">

                <button
                    class="create-button"
                    id="createButton"
                    aria-label="Buat atau unggah video"
                    type="button"
                >
                    <span class="create-icon">+</span>
                    Buat
                </button>

                <div
                    class="create-menu"
                    id="createMenu"
                ></div>

            </div>

            <div class="notification-wrapper">

                <button
                    class="icon-button"
                    id="notificationButton"
                    aria-label="Notifikasi"
                >
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 22a2.2 2.2 0 002.2-2.2h-4.4A2.2 2.2 0 0012 22zm7-6v-5a7 7 0 00-5.5-6.84V3a1.5 1.5 0 00-3 0v1.16A7 7 0 005 11v5l-2 2v1h18v-1z"/></svg>
                </button>

                <div
                    class="notification-menu"
                    id="notificationMenu"
                >

                    <p class="notification-title">
                        Notifikasi
                    </p>

                    <p class="notification-empty">
                        Tidak ada notifikasi baru.
                    </p>

                </div>

            </div>

            <div class="profile-wrapper">

                <button
                    class="profile-button"
                    id="profileButton"
                    aria-label="Akun"
                >
                    M
                </button>

                <div
                    class="profile-menu"
                    id="profileMenu"
                ></div>

            </div>

        </div>

    </header>


    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar" id="sidebar">

        <nav>

            <a href="index.html" class="sidebar-item">
                <span><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg></span>
                <span>Home</span>
            </a>

            <a href="#" class="sidebar-item">
                <span><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2c1 3-3 4-3 7a3 3 0 006 0c0-1-1-2-1-3 2 1 4 4 4 7a6 6 0 11-12 0c0-4 3-7 6-11z"/></svg></span>
                <span>Trending</span>
            </a>

            <a href="#" class="sidebar-item">
                <span><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M4 5h16a1 1 0 011 1v11a1 1 0 01-1 1h-5v2h-6v-2H4a1 1 0 01-1-1V6a1 1 0 011-1zm5 3v7l6-3.5z"/></svg></span>
                <span>Subscriptions</span>
            </a>

            <div class="sidebar-divider"></div>

            <a href="#" class="sidebar-item">
                <span><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="3" y="4" width="18" height="3" rx="1"/><rect x="3" y="10.5" width="18" height="3" rx="1"/><rect x="3" y="17" width="12" height="3" rx="1"/></svg></span>
                <span>Library</span>
            </a>

            <a href="#" class="sidebar-item">
                <span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></svg></span>
                <span>History</span>
            </a>

            <a href="#" class="sidebar-item">
                <span><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M4 5a2 2 0 012-2h12a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm6 3v8l6-4z"/></svg></span>
                <span>Your videos</span>
            </a>

            <a href="#" class="sidebar-item">
                <span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2L6.5 4M15 2l2.5 2"/></svg></span>
                <span>Watch later</span>
            </a>

            <div class="sidebar-divider"></div>

            <h3>Explore</h3>

            <a href="#" class="sidebar-item">
                <span><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M9 18V5l11-2v13M9 18a3 3 0 11-6 0 3 3 0 016 0zm11-2a3 3 0 11-6 0 3 3 0 016 0z"/></svg></span>
                <span>Music</span>
            </a>

            <a href="#" class="sidebar-item">
                <span><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M7 7h10a4 4 0 014 4l1 6a2 2 0 01-3.6 1.2L16 15H8l-2.4 3.2A2 2 0 012 17l1-6a4 4 0 014-4zm.5 2.5v2h-2v1.5h2v2h1.5v-2h2V11.5h-2v-2zM17 10a1.2 1.2 0 100 2.4A1.2 1.2 0 0017 10zm3 2.5a1.2 1.2 0 100 2.4 1.2 1.2 0 000-2.4z"/></svg></span>
                <span>Gaming</span>
            </a>

            <a href="#" class="sidebar-item">
                <span><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M4 4h16a1 1 0 011 1v11H3V5a1 1 0 011-1zm-3 14h22l-2 3H3z"/></svg></span>
                <span>Technology</span>
            </a>

            <a href="#" class="sidebar-item">
                <span><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 6.2C10 4.6 7 4 4 4v13c3 0 6 .6 8 2.2 2-1.6 5-2.2 8-2.2V4c-3 0-6 .6-8 2.2z"/></svg></span>
                <span>Education</span>
            </a>

        </nav>

    </aside>


    <!-- MOBILE SIDEBAR OVERLAY -->

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>


    <!-- ================= WATCH PAGE ================= -->

    <main class="watch-main main-content">

        <div class="watch-container">

        <div class="watch-video-wrap">

            <!-- VIDEO PLAYER -->

            <div class="video-player" id="videoPlayer">

                <video
                    id="mainVideo"
                    preload="metadata"
                >
                </video>

                <button
                    class="play-button"
                    id="playButton"
                    aria-label="Play video"
                >
                    ▶
                </button>

            </div>

        </div>


        <section class="watch-primary">

            <!-- VIDEO TITLE -->

            <h1
                class="watch-title"
                id="videoTitle"
            >
                Loading video...
            </h1>


            <!-- VIDEO INFORMATION -->

            <div
                class="watch-info"
                id="videoInfo"
            >
                Loading information...
            </div>


            <!-- COMMENTS -->

            <div
                class="comments-section"
                id="commentsSection"
            ></div>

        </section>


        <!-- VIDEO TERKAIT -->

        <aside
            class="watch-secondary"
            id="watchSecondary"
        ></aside>

        </div>

    </main>



    <!-- FLOATING MINIPLAYER (KUSTOM, BUKAN PIP BROWSER) -->

    <div
        class="floating-miniplayer"
        id="floatingMiniplayer"
    >

        <div
            class="floating-miniplayer-draghandle"
            id="floatingMiniplayerDragHandle"
        ></div>

        <video
            id="floatingMiniplayerVideo"
            muted
            playsinline
        ></video>

        <div class="floating-miniplayer-controls">

            <button
                class="floating-miniplayer-playpause"
                id="floatingMiniplayerPlayPause"
                type="button"
                aria-label="Jeda/putar"
            >
                ⏸
            </button>

            <button
                class="floating-miniplayer-popout"
                id="floatingMiniplayerPopout"
                type="button"
                aria-label="Tampilkan di luar browser"
                title="Tampilkan di luar browser (Picture-in-Picture sistem)"
            >
                ⧉
            </button>

            <button
                class="floating-miniplayer-close"
                id="floatingMiniplayerClose"
                type="button"
                aria-label="Tutup miniplayer"
            >
                ✕
            </button>

        </div>

        <div
            class="floating-miniplayer-resize-handle resize-tl"
            data-horiz="left"
            data-vert="top"
        ></div>

        <div
            class="floating-miniplayer-resize-handle resize-tr"
            data-horiz="right"
            data-vert="top"
        ></div>

        <div
            class="floating-miniplayer-resize-handle resize-bl"
            data-horiz="left"
            data-vert="bottom"
        ></div>

        <div
            class="floating-miniplayer-resize-handle resize-br"
            data-horiz="right"
            data-vert="bottom"
        ></div>

    </div>


    <script src="js/script.js"></script>

</body>

</html>
